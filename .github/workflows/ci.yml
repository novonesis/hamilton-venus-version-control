name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every action is pinned to a commit SHA, with its tag in a comment: a tag or a
# branch can be moved to new code without this file changing. Dependabot
# (.github/dependabot.yml) proposes the updates.

jobs:
  test:
    # The application binds Windows-only APIs (pywin32, winshell) and drives
    # the Hamilton Venus converter as a subprocess, so the test job has to run
    # on Windows to import the modules at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      # Fails if uv.lock is out of date with pyproject.toml, so a dependency
      # change cannot land unlocked.
      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v

  # A strict build fails on a nav entry with no file behind it and on an API
  # page for a module that no longer exists. Both drift silently otherwise:
  # docs/api/gui.md documented a GUI rewritten months before anyone noticed.
  # Windows, like the tests: building the docs installs the project, and
  # pywin32 does not install anywhere else.
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build the docs strictly
        run: uv run --frozen --group docs mkdocs build --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified
